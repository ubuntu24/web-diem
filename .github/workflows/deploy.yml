name: WEB DIEM - Build and Push

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Run Frontend Tests
        run: |
          cd frontend
          npm install
          npm run test
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Run Backend Tests
        run: |
          cd backend
          pip install -r requirements.txt
          python3 -m pytest

  build-and-push:
    runs-on: self-hosted
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: ghcr.io/${{ github.repository }}/web-diem-backend:${{ github.sha }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/web-diem-frontend:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ─── BƯỚC 1: Tạo file .env cho quá trình build ───────────────────────────
      - name: Create .env files for build
        run: |
          # Reassure user and proceed safely
          echo "=== Tạo file .env an toàn ==="
          
          # Tạo file ở thư mục gốc (nơi vừa test touch thành công)
          cat << 'EOF' > temp_frontend_env
          ${{ secrets.FRONTEND_ENV }}
          EOF
          
          cat << 'EOF' > temp_backend_env
          ${{ secrets.BACKEND_ENV }}
          EOF
          
          # Move vào thư mục đích
          mkdir -p frontend backend
          mv temp_frontend_env frontend/.env
          mv temp_backend_env backend/.env
          
          # Đảm bảo frontend luôn trỏ tới container backend
          echo "API_URL=http://backend:8000" >> frontend/.env
          echo "DOCKER_ENV=true" >> frontend/.env
          
          # Ghi tiếp các biến khác
          [ -n "${{ secrets.REDIS_URL }}" ]             && echo "REDIS_URL=${{ secrets.REDIS_URL }}"                       >> backend/.env
          [ -n "${{ secrets.DATABASE_URL }}" ]          && echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"                 >> backend/.env
          [ -n "${{ secrets.ADMIN_PASSWORD }}" ]        && echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}"             >> backend/.env
          [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]    && echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"     >> backend/.env
          [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]      && echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"         >> backend/.env
          touch .env.tunnel
          [ -n "${{ secrets.ENV_TUNNEL }}" ]            && echo "${{ secrets.ENV_TUNNEL }}"                                >> .env.tunnel
          [ -n "${{ secrets.TUNNEL_TOKEN }}" ]          && echo "TUNNEL_TOKEN=${{ secrets.TUNNEL_TOKEN }}"                 >> .env.tunnel
          [ -n "${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" ] && echo "TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}"   >> .env.tunnel
          [ -n "${{ secrets.CF_TUNNEL_TOKEN }}" ]        && echo "TUNNEL_TOKEN=${{ secrets.CF_TUNNEL_TOKEN }}"          >> .env.tunnel
          [ -n "${{ secrets.CLOUDFLARED_TOKEN }}" ]      && echo "TUNNEL_TOKEN=${{ secrets.CLOUDFLARED_TOKEN }}"        >> .env.tunnel
          [ -n "${{ secrets.CF_TOKEN }}" ]               && echo "TUNNEL_TOKEN=${{ secrets.CF_TOKEN }}"                 >> .env.tunnel

          echo "=== Tạo file .env thành công ==="

      # ─── BƯỚC 2: Login vào GitHub Container Registry ─────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── BƯỚC 3: Build & Push Docker images lên GHCR ───────────────────────
      - name: Build and Push Backend image
        run: |
          set -euo pipefail
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Build attempt $i/$MAX_RETRIES"
            if docker build --network host --pull -t "$BACKEND_IMAGE" ./backend; then
              docker push "$BACKEND_IMAGE"
              break
            fi
            if [ $i -eq $MAX_RETRIES ]; then
              echo "Backend build failed after $MAX_RETRIES attempts"
              exit 1
            fi
            sleep $((i * 10))
          done

      - name: Build and Push Frontend image
        run: |
          set -euo pipefail
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Build attempt $i/$MAX_RETRIES"
            if docker build --network host --pull -t "$FRONTEND_IMAGE" --build-arg API_URL=http://backend:8000 ./frontend; then
              docker push "$FRONTEND_IMAGE"
              break
            fi
            if [ $i -eq $MAX_RETRIES ]; then
              echo "Frontend build failed after $MAX_RETRIES attempts"
              exit 1
            fi
            sleep $((i * 10))
          done

          # Dọn dẹp ảnh Docker cũ trên runner để tiết kiệm disk
          docker image prune -a -f --filter "until=24h"

      - name: Deploy Containers with Docker Compose
        run: |
          echo "=== Removing old containers & Starting Docker Compose services ==="
          docker compose down --remove-orphans || true
          docker rm -f flaresolverr web-diem-backend web-diem-frontend cloudflared web-diem-redis 2>/dev/null || true

          # Debug: kiểm tra TUNNEL_TOKEN có được ghi vào .env.tunnel không
          echo "=== .env.tunnel content (masked) ==="
          grep -c 'TUNNEL_TOKEN' .env.tunnel && echo "TUNNEL_TOKEN found" || echo "WARNING: TUNNEL_TOKEN not found in .env.tunnel"

          if ! docker compose up -d --build; then
            echo "=== BACKEND LOGS ==="
            docker logs web-diem-backend || true
            echo "=== FRONTEND LOGS ==="
            docker logs web-diem-frontend || true
            exit 1
          fi

          # Chờ 15s rồi in log cloudflared để xác nhận tunnel đã kết nối
          sleep 15
          echo "=== CLOUDFLARED LOGS ==="
          docker logs cloudflared --tail 30 || true

          docker compose ps



